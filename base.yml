version: 1.5
benchmarker: "Izaskun Mallona, Daniel Incicau"
benchmark_yaml_spec: 0.4

software_environments:
  clustbench:
    description: "clustbench on py3.12.9, optimized python build"
    conda: envs/clustbench.yml
    envmodule: clustbench/0.1.0-foss-2023b
    apptainer: oras://quay.io/omnibenchmark/clustbench-vanilla:0.1.0

  fcps:
    description: "CRAN's FCPS"
    conda: envs/fcps.yml
    envmodule: fcps/1.3.4-foss-2023a-r-4.3.2
    apptainer: oras://quay.io/omnibenchmark/fcps:0.1.1

  rmarkdown:
    description: "R with some plotting dependencies"
    conda: envs/rmarkdown.yml
    envmodule: rmarkdown/0.1.0-gfbf-2024a-r-4.4.2
    apptainer: oras://quay.io/omnibenchmark/fcps:0.1.1

metric_collectors:
  - id: plotting
    name: "Single-backend metric collector."
    software_environment: rmarkdown
    repository:
      url: https://github.com/imallona/clustering_report
      commit: 167e221
    inputs:
      - metrics.scores
    outputs:
      - id: plotting.html
        path: "{input}/{name}/plotting_report.html"

stages:
  - id: data
    modules:
      - id: clustbench
        name: "clustbench datasets, from https://www.sciencedirect.com/science/article/pii/S0020025521010082#t0005 Table1"
        software_environment: clustbench
        repository:
          url: https://github.com/imallona/clustbench_data
          commit: 31ac323

        parameters: # comments depict the possible cardinalities and the number of curated labelsets
          - values: ["--dataset_generator", "fcps", "--dataset_name", "lsun"] #	3	1
          - values: ["--dataset_generator", "wut", "--dataset_name", "circles"] #	4	1
          - values: ["--dataset_generator", "wut", "--dataset_name", "cross"] #	4	1
          - values: ["--dataset_generator", "wut", "--dataset_name", "graph"] #	10	1
          - values: ["--dataset_generator", "wut", "--dataset_name", "mk3"] #	3	1
          - values: ["--dataset_generator", "wut", "--dataset_name", "x1"] #	3	1
          - values: ["--dataset_generator", "wut", "--dataset_name", "x2"] #	3	1
          - values: ["--dataset_generator", "wut", "--dataset_name", "x3"] #	4	1
          - values: ["--dataset_generator", "wut", "--dataset_name", "z1"] #	3	1
          - values: ["--dataset_generator", "wut", "--dataset_name", "z2"] #	5	1
          - values: ["--dataset_generator", "wut", "--dataset_name", "z3"] #	4	1
    outputs:
      - id: data.matrix
        path: "{input}/{stage}/{module}/{params}/{dataset}.data.gz"
      - id: data.true_labels
        path: "{input}/{stage}/{module}/{params}/{dataset}.labels0.gz"

  - id: clustering
    modules:
      - id: fcps
        name: "fcps"
        software_environment: "fcps"
        repository:
          url: https://github.com/btraven00/clustbench_fcps
          commit: de1eb7e
        parameters:
          # this for sure would look nicer if we implement a combinatorial approach
          - values: ["--method", "FCPS_Minimax", "--seed", "839"]
          - values: ["--method", "FCPS_Minimax", "--seed", "172"]
          - values: ["--method", "FCPS_Minimax", "--seed", "323"]
          - values: ["--method", "FCPS_Minimax", "--seed", "812"]
          - values: ["--method", "FCPS_Minimax", "--seed", "692"]
          - values: ["--method", "FCPS_MinEnergy", "--seed", "839"]
          - values: ["--method", "FCPS_MinEnergy", "--seed", "172"]
          - values: ["--method", "FCPS_MinEnergy", "--seed", "323"]
          - values: ["--method", "FCPS_MinEnergy", "--seed", "812"]
          - values: ["--method", "FCPS_MinEnergy", "--seed", "692"]
          - values: ["--method", "FCPS_HDBSCAN_2", "--seed", "839"]
          - values: ["--method", "FCPS_HDBSCAN_2", "--seed", "172"]
          - values: ["--method", "FCPS_HDBSCAN_2", "--seed", "323"]
          - values: ["--method", "FCPS_HDBSCAN_2", "--seed", "812"]
          - values: ["--method", "FCPS_HDBSCAN_2", "--seed", "692"]
          - values: ["--method", "FCPS_HDBSCAN_4", "--seed", "839"]
          - values: ["--method", "FCPS_HDBSCAN_4", "--seed", "172"]
          - values: ["--method", "FCPS_HDBSCAN_4", "--seed", "323"]
          - values: ["--method", "FCPS_HDBSCAN_4", "--seed", "812"]
          - values: ["--method", "FCPS_HDBSCAN_4", "--seed", "692"]
          - values: ["--method", "FCPS_HDBSCAN_8", "--seed", "839"]
          - values: ["--method", "FCPS_HDBSCAN_8", "--seed", "172"]
          - values: ["--method", "FCPS_HDBSCAN_8", "--seed", "323"]
          - values: ["--method", "FCPS_HDBSCAN_8", "--seed", "812"]
          - values: ["--method", "FCPS_HDBSCAN_8", "--seed", "692"]
          - values: ["--method", "FCPS_Diana", "--seed", "839"]
          - values: ["--method", "FCPS_Diana", "--seed", "172"]
          - values: ["--method", "FCPS_Diana", "--seed", "323"]
          - values: ["--method", "FCPS_Diana", "--seed", "812"]
          - values: ["--method", "FCPS_Diana", "--seed", "692"]
          - values: ["--method", "FCPS_Fanny", "--seed", "839"]
          - values: ["--method", "FCPS_Fanny", "--seed", "172"]
          - values: ["--method", "FCPS_Fanny", "--seed", "323"]
          - values: ["--method", "FCPS_Fanny", "--seed", "812"]
          - values: ["--method", "FCPS_Fanny", "--seed", "692"]
          - values: ["--method", "FCPS_Hardcl", "--seed", "839"]
          - values: ["--method", "FCPS_Hardcl", "--seed", "172"]
          - values: ["--method", "FCPS_Hardcl", "--seed", "323"]
          - values: ["--method", "FCPS_Hardcl", "--seed", "812"]
          - values: ["--method", "FCPS_Hardcl", "--seed", "692"]
          - values: ["--method", "FCPS_Softcl", "--seed", "839"]
          - values: ["--method", "FCPS_Softcl", "--seed", "172"]
          - values: ["--method", "FCPS_Softcl", "--seed", "323"]
          - values: ["--method", "FCPS_Softcl", "--seed", "812"]
          - values: ["--method", "FCPS_Softcl", "--seed", "692"]
          - values: ["--method", "FCPS_Clara", "--seed", "839"]
          - values: ["--method", "FCPS_Clara", "--seed", "172"]
          - values: ["--method", "FCPS_Clara", "--seed", "323"]
          - values: ["--method", "FCPS_Clara", "--seed", "812"]
          - values: ["--method", "FCPS_Clara", "--seed", "692"]
          - values: ["--method", "FCPS_PAM", "--seed", "839"]
          - values: ["--method", "FCPS_PAM", "--seed", "172"]
          - values: ["--method", "FCPS_PAM", "--seed", "323"]
          - values: ["--method", "FCPS_PAM", "--seed", "812"]
          - values: ["--method", "FCPS_PAM", "--seed", "692"]
    inputs:
      - entries:
          - data.matrix
          - data.true_labels
    outputs:
      - id: clustering.predicted_ks_range
        path: "{input}/{stage}/{module}/{params}/{dataset}_ks_range.labels.gz"

  - id: metrics
    modules:
      - id: partition_metrics
        name: "clustbench partition metrics"
        software_environment: clustbench
        repository:
          url: https://github.com/imallona/clustbench_metrics
          commit: 9132d45
        parameters:
          - values: ["--metric", "normalized_clustering_accuracy"]
          - values: ["--metric", "adjusted_fm_score"]
          - values: ["--metric", "adjusted_mi_score"]
          - values: ["--metric", "adjusted_rand_score"]
          - values: ["--metric", "fm_score"]
          - values: ["--metric", "mi_score"]
          - values: ["--metric", "normalized_clustering_accuracy"]
          - values: ["--metric", "normalized_mi_score"]
          - values: ["--metric", "normalized_pivoted_accuracy"]
          - values: ["--metric", "pair_sets_index"]
          - values: ["--metric", "rand_score"]
    inputs:
      - entries:
          - clustering.predicted_ks_range
          - data.true_labels
    outputs:
      - id: metrics.scores
        path: "{input}/{stage}/{module}/{params}/{dataset}.scores.gz"
